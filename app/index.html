<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud Deployment Lab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 40px 60px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    h1 { color: #38bdf8; }
    p.version { color: #94a3b8; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from Docker + Terraform + Ansible + Jenkins!</h1>
    <p>This page was deployed through a fully automated pipeline.</p>
    <p class="version">v1.0</p>
  </div>
</body>
</html>
